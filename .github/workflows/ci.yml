name: CI - Safety & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      DEBUG: false
      BOOTSTRAP_ADMIN_PASSWORD: AdminPassTest123!
      BOOTSTRAP_SUPERVISOR_PASSWORD: SupervisorPassTest123!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for OpenCV & MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Upgrade pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Code Compilation
        run: |
          python -m compileall backend/

      - name: Execute Safety Engine & Hardening Test Suite
        run: |
          pytest -v --maxfail=5
